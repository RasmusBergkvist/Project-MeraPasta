<section class="dashboard">
    <h1>Välkommen {{authService.currentUsername()}}!</h1>
    @if(authService.isAdmin()) {
    <p>Här kan du hantera användare, bokningar, öppettider, menyer och dess innehåll.</p>
    }@else{
    <p>Här kan du hantera menyernas innehåll, bokningar och öppettider.</p>

    }

    <!-- Endast admin kan hantera menykategorierna -->
    @if(authService.isAdmin()) {
    <app-mange-category></app-mange-category>
    }

     <!-- Läser in menu-komponent med menyartiklar -->
    <app-menu [isDashboard]="true"></app-menu>

    <app-manage-reservation></app-manage-reservation>

</section>
