<header>
    <div class="header-container">
        <a routerLink="/">
            <img [src]="'logo_mp.svg'" width="388" height="155" alt="logo Mera Pasta Ristorante" />
        </a>

        <!-- Knapp hambugermeny  -->
        <button class="mobile-menu" (click)="toggleMenu()" [attr.aria-label]="isMenuOpen() ? 'Stäng meny' : 'Öppna meny'">
        @if(isMenuOpen()){
             &times;
        } @else {
            &#9776;
        }
        </button>
        <!-- Meny ändras beroende på inloggning och roll -->
        <nav [class.is-open]=" isMenuOpen()" (click)="closeMenu()">
            <ul>
                @if(!authService.isLoggedIn()){
                <li><a routerLink="/" fragment="menu">MENY</a></li>
                <li><a routerLink="/" fragment="reservation">BOKA BORD</a></li>
                <li><a routerLink="/" fragment="opening-hours">ÖPPETTIDER</a></li>
                <li><a routerLink="/" fragment="about">OM OSS</a></li>
                } @else {
                @if(authService.isAdmin()) {
                <li><a routerLink="/users">ANVÄNDARE</a></li>
                <li><a routerLink="/dashboard" fragment="manage-category">MENYKATEGORI</a></li>
                }
                <li><a routerLink="/dashboard" fragment="manage-menu">MENYARTIKEL</a></li>
                <li><a routerLink="/dashboard" fragment="manage-reservation">BOKNINGAR</a></li>
                <li><a routerLink="/dashboard" fragment="manage-opening-hours">ÖPPETTIDER</a></li>
                }
            </ul>
            </nav>
    </div>
</header>
